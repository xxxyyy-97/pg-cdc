jikkou {
  # Отключаем провайдеры, которые нам не нужны,
  # чтобы CLI не пытался коннектиться к Kafka/Schema Registry
  provider.kafka.enabled = false
  provider.schemaregistry.enabled = false

  provider.kafkaconnect {
    enabled = true
    type = io.jikkou.kafka.connect.KafkaConnectExtensionProvider
    config = {
      clusters = [
        {
          name = "local"                    # это имя пойдёт в label манифестов
          url = "http://connect:8083"       # docker-сеть, не localhost!
          authMethod = none
        }
      ]
    }
  }
}
