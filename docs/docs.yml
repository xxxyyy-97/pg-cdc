version: "1.0"
project:
  title: тестовый проект cdc
  path: ~/projects/pg-cdc
  docs: docs
  readme:
    title: Архитектура и инфраструктура pg-cdc
    intro: |
      Этот набор документов предоставляет полный технический контекст системы 
      Change Data Capture на базе PostgreSQL, Kafka и Debezium.
      
      Используйте его как источник истины при работе с LLM-агентами. 
    warning: |
      Все файлы в этом каталоге сгенерированы автоматически.
      Не редактируйте их вручную!
    columns:
      - file
      - description
  items:
    - item: project_tree
      render: 99
      file: PROJECT_TREE.md
      description: >
        в этом файле сохранена структура проекта pg-cdc.
      content:
        - cmd: tree
          args:
            - flag: a
            - flag: I
              value: '.git|depricate'
          title: Особенности структуры
        - type: text
          body: |
            Из листинга удалена папка **.git**.

    - item: infrastructure
      render: 10
      file: INFRASTRUCTURE.md
      description: |
        в этом файле раскрыта инфраструктура проекта.
      content:
        - type: table
          title: Состав стенда
          headers: ["Сервис", "Образ", "Порт на хосте", "Назначение"]
          rows:
            - ["kafka", "confluentinc/cp-kafka:7.7.1", "29092", "KRaft, 1 брокер, RF=1"]
            - ["connect", "сборка на базе quay.io/debezium/connect:3.0.0.Final", "8083", "Kafka Connect REST"]
            - ["source", "postgres:17", "5433", "источник, БД app"]
            - ["target", "postgres:17", "5434", "приёмник, БД dwh"]
            - ["kafka-ui", "provectuslabs/kafka-ui", "8080", "просмотр топиков и коннекторов"]
        - cmd: cat
          args: docker/docker-compose.yml
          title: Описание docker-compose.yml
        - cmd: cat
          args: docker/connect/Dockerfile
          title: Описание oбраза debezium
        - cmd: awk
          lang: sql
          args: 
            - 'FNR==1 {print "\n==>", FILENAME, "<==\n"} 1'
            - docker/init/source/*
          title: Настройка источника pg-source
        - cmd: awk
          lang: sql
          args: 
            - 'FNR==1 {print "\n==>", FILENAME, "<==\n"} 1'
            - docker/init/target/*
          title: Настройка приемника pg-target
        - type: alert
          alert: WARNING
          body: |
            Файл docker/.env содержит секреты.
            В репозитории хранится только .env.example.
        - cmd: cat
          args: docker/.env.example
          title: Шаблон переменных окружения. Переименуйте в .env и подставьте нужные значения
    - item: debezium
      render: 20
      file: DEBEZIUM.md
      description: |
        В этом файле описаны debezium-коннекторы.
      content:
        - cmd: cat
          args: connectors/pg-orders-source.yaml
          title: producer таблицы orders в источнике
        - cmd: cat
          args: connectors/pg-orders-sink.yaml
          title: consumer таблицы orders_hist в приемнике

    - item: journal
      render: 25
      file: JOURNAL.md
      description: |
        Журнал cdc.orders_hist: смысл полей, выбор версии строки, готовые запросы.
        DDL журнала — в INFRASTRUCTURE.md, маппинг полей коннектором — в DEBEZIUM.md.
      content:
        - type: table
          title: Метаданные CDC
          headers: ["Поле", "Тип", "Кто заполняет", "Точный смысл", "Подводные камни"]
          rows:
            - ["op_raw", "text NOT NULL", "Debezium op → SMT add.fields=op → rename __op", "c — INSERT, u — UPDATE, d — DELETE, r — snapshot read", "При d бизнес-колонки из before (нужен REPLICA IDENTITY FULL). t/m в этой конфигурации не приходят"]
            - ["src_lsn", "bigint", "source.lsn", "Байтовая позиция записи в WAL источника", "Не уникален: одинаков у снапшот-строк и multi-insert. Не ключ дедупа. После failover нумерация другая"]
            - ["src_xid", "bigint", "source.txId", "XID транзакции; одинаков у всех её событий", "32-битный, зацикливается (~4.29 млрд) → только группировать, не сортировать глобально"]
            - ["commit_ts_ms", "bigint", "source.ts_ms", "Время коммита транзакции источника, epoch ms UTC", "Для r — момент снапшота. Точность 1 мс. Это время БД-источника, не время обработки коннектором"]
            - ["is_deleted", "boolean", "SMT rewrite добавляет __deleted", "true только у op_raw='d'", "Избыточен — дублирует op_raw. В boolean попадает благодаря stringtype=unspecified"]
            - ["kafka_partition", "integer NOT NULL", "SMT InsertField$Value", "Партиция топика app.public.orders", "Сейчас всегда 0. Часть ключа идемпотентности"]
            - ["kafka_offset", "bigint NOT NULL", "SMT InsertField$Value", "Смещение в партиции, строго монотонно", "Уникален в паре (partition, offset) в рамках одного топика. Обнуляется при пересоздании топика. Ключ дедупликации"]
        - type: table
          title: Остальные колонки
          headers: ["Поле", "Тип", "Смысл", "Особенности"]
          rows:
            - ["hist_id", "bigint identity", "Локальный счётчик вставок в приёмнике", "Порядок загрузки ≠ порядок источника. Возможны пропуски"]
            - ["op", "char(1) generated", "I / U / D / R — вычисляется из op_raw", "R = снапшот. Sink его не пишет"]
            - ["loaded_at", "timestamptz DEFAULT now()", "Время вставки в приёмник", "Для расчёта лага. Не транзакционно: события одной транзакции могут попасть в разные батчи"]
        - type: table
          title: Какое поле для чего годится
          headers: ["Поле", "Пригодность для определения последней версии"]
          rows:
            - ["src_lsn", "✅ основной ключ сортировки — физический порядок изменений в WAL"]
            - ["kafka_offset", "✅ тай-брейкер: разруливает одинаковый LSN и повторные доставки"]
            - ["commit_ts_ms", "⚠️ только для срезов на момент времени; внутри транзакции одинаков"]
            - ["src_xid", "❌ 32-битный, зацикливается, не монотонен"]
            - ["loaded_at, hist_id", "❌ порядок загрузки ≠ порядок источника"]
            - ["updated_at", "❌ бизнес-поле, может не меняться"]
            - ["op / op_raw / is_deleted", "✅ для отсева удалённых, но не для сортировки"]
        - type: text
          title: Дополнительные запросы и шпаргалки
          body: |
            [add_journal.md](static/add_journal.md)

    - item: jikkou
      render: 30
      file: JIKKOU.md
      description: |
        Управление debezium-коннекторами через jikkou (GitOps).
        Манифесты: connectors/*.yaml. Конфиг: docker/jikkou/application.conf.
        Alias jikkou = docker compose run --rm jikkou (запускать из docker/).
      content:
        - type: text
          body: |
            Принцип: **источник истины — YAML в Git**. Любое изменение = правка манифеста → diff → apply.
            Руками через REST/UI ничего не меняем — jikkou увидит это как дрейф.
        - type: table
          title: Жизненный цикл коннекторов
          title_level: 3
          headers: ["Команда", "Действие"]
          rows:
            - ['`jikkou diff --files connectors/`', 'превью изменений против РЕАЛЬНОГО кластера; ничего не трогает']
            - ['`jikkou apply --files connectors/`', 'FULL reconcile: создаст, обновит, удалит помеченные; идемпотентен (повтор → ok: N, altered: 0)']
            - ["`jikkou apply --files connectors/ -s 'metadata.name IN (pg-orders-sink)'`", 'точечно один коннектор из директории']
            - ['`jikkou apply --files connectors/ --dry-run`', 'то же, что diff, но в формате результата apply']
            - ['`jikkou create --files connectors/`', 'только CREATE, существующие не трогает']
            - ['`jikkou update --files connectors/`', 'CREATE + UPDATE, без удалений']
            - ['`jikkou replace --files connectors/pg-orders-sink.yaml`', 'DELETE + CREATE заново; для source может запустить новый снапшот']
            - ['`jikkou validate --files connectors/`', 'проверка манифестов до похода в кластер: name, label connect-cluster, connectorClass, tasksMax']
        - type: table
          title: Пауза / остановка / запуск
          title_level: 3
          headers: ["Действие", "Как"]
          rows:
            - ['Поставить на паузу', '`spec.state: PAUSED` в манифесте → `jikkou apply`']
            - ['Остановить (конфиг сохраняется)', '`spec.state: STOPPED` → `jikkou apply`']
            - ['Вернуть в работу', '`spec.state: RUNNING` → `jikkou apply`']
            - ['Перезапустить упавшие инстансы и задачи', '`jikkou action kafkaconnectrestartconnectors execute --only-failed --include-tasks`']
            - ['Перезапустить конкретный коннектор целиком', '`jikkou action kafkaconnectrestartconnectors execute --connector-name pg-orders-sink --include-tasks`']
        - type: alert
          alert: IMPORTANT
          title: Удаление — только через аннотацию
          body: |
            Просто удалить YAML и сделать apply — НЕ сработает: orphan-коннекторы не вычисляются (deleteOrphans=false в KafkaConnectorChangeComputer).
            Правильный путь:
            1. Добавить в манифест `metadata.annotations["jikkou.io/delete"]: true`
            2. `jikkou delete --files connectors/pg-orders-sink.yaml` (или apply)
            3. `git rm connectors/pg-orders-sink.yaml`
            Для source после удаления вручную дропнуть осиротевший слот на pg-source.
        - type: table
          title: Наблюдение и статус
          title_level: 3
          headers: ["Команда", "Действие"]
          rows:
            - ["`jikkou get kafkaconnect connectors`", "список коннекторов + конфиги; spec.state — ЖЕЛАЕМОЕ, не фактическое"]
            - ["`jikkou get kafkaconnect connectors --name pg-orders-sink`", "один коннектор"]
            - ["`jikkou get kafkaconnect connectors -o JSON`", "для скриптов"]
            - ["`jikkou health get kafkaconnect`", "здоровье воркера: UP/DOWN, версия, kafkaClusterId"]
            - ["`curl -s 'localhost:8083/connectors?expand=status' | jq ...`", "фактический RUNNING/FAILED коннекторов и задач (URL в кавычках — zsh!)"]
            - ["`curl -s 'localhost:8083/connectors/pg-orders-sink/status' | jq`", "полный JSON с trace при FAILED"]
            - ['`jikkou action kafkaconnectrestartconnectors execute --only-failed --include-tasks`', 'альтернатива curl: возвращает статус в ответе + перезапускает упавшее']
        - type: alert
          alert: WARNING
          title: Баг версии 1.1.0
          body: |
            Флаг `--expand-status` описан в документации, но не работает: KafkaConnectorCollector не переопределяет configProperties(), поэтому опция не регистрируется в CLI.
            Используйте curl expand=status или action --only-failed для просмотра фактического статуса.
        - type: table
          title: Контроль дрейфа и CI
          title_level: 3
          headers: ["Команда", "Действие"]
          rows:
            - ['`jikkou diff --files connectors/`', 'кто-то поменял конфиг через kafka-ui → видно сразу, без state-файла']
            - ['`jikkou diff --files connectors/ --fail-on-changes`', 'exit code 3 при любом расхождении; для cron/CI']
            - ['`jikkou diff --files connectors/ --filter-resource-op CREATE,DELETE`', 'смотреть только нужные операции']
            - ['`jikkou apply --files connectors/`', 'откатить ручные изменения к состоянию из Git']
        - type: table
          title: Интроспекция и шаблоны
          title_level: 3
          headers: ["Команда", "Действие"]
          rows:
            - ['`jikkou api-providers list`', 'какие провайдеры доступны и включены']
            - ['`jikkou api-resources`', 'какие ресурсы поддерживает сборка']
            - ['`jikkou api-extensions`', 'коллекторы, контроллеры, actions']
            - ['`jikkou config view`', 'merged-конфиг (проверить clusters, url)']
            - ['`jikkou config current-context`', 'текущий контекст (local)']
            - ['`jikkou apply --files connectors/orders.tpl --values-files values.yaml`', 'Jinja-шаблон: один манифест × N таблиц/окружений']
            - ['`jikkou get kafkaconnect connectors -o YAML > current.yaml`', 'экспорт состояния кластера в Git']
