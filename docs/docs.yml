version: "1.0"
project:
  title: тестовый проект cdc
  path: ~/projects/pg-cdc
  docs: docs
  items:
    - item: project_tree
      render: 99
      file: PROJECT_TREE.md
      description: >
        в этом файле сохранена структура проекта pg-cdc.
      content:
        - cmd: tree
          args:
            - flag: a
            - flag: I
              value: '.git'
          title: Особенности структуры
        - type: text
          body: |
            Из листинга удалена папка **.git**.

    - item: infrastructure
      render: 10
      file: INFRASTRUCTURE.md
      description: |
        в этом файле раскрыта инфраструктура проекта.
        расположение файлов и общую структуру можно уточнить в файле PROJECT_TREE.md
      content:
        - cmd: cat
          args: docker/docker-compose.yml
          title: Описание docker-compose.yml
        - cmd: cat
          args: docker/connect/Dockerfile
          title: Описание oбраза debezium
        - cmd: awk
          lang: sql
          args: 
            - 'FNR==1 {print "\n==>", FILENAME, "<==\n"} 1'
            - docker/init/source/*
          title: Настройка источника pg-source
        - cmd: awk
          lang: sql
          args: 
            - 'FNR==1 {print "\n==>", FILENAME, "<==\n"} 1'
            - docker/init/target/*
          title: Настройка приемника pg-target
        - type: alert
          alert: WARNING
          body: |
            Файл docker/.env содержит секреты.
            В репозитории хранится только .env.example.
        - cmd: cat
          args: docker/.env.example
          title: Шаблон переменных окружения. Переименуйте в .env и подставьте нужные значения

    - item: debezium
      render: 20
      file: DEBEZIUM.md
      description: |
        В этом файле описаны debezium-коннекторы.
      content:
        - cmd: cat
          args: connectors/01-source-orders.json
          title: producer таблицы orders в источнике
        - cmd: cat
          args: connectors/02-sink-orders.json
          title: consumer таблицы orders_hist в приемнике
          
    - item: register
      render: 30
      file: REGISTER.md
      description: Описание работы скрипта register.sh
      content:       
        - type: table
          title: что может register.sh
          title_level: 3
          headers: ["Команда", "Действие"]
          rows:
            - ['`./register.sh`', 'как раньше: все коннекторы + ожидание RUNNING']
            - ['`./register.sh reg sink-orders`', 'один коннектор; принимает имя файла, *.json или имя коннектора']
            - ['`./register.sh del pg-orders-sink`', 'DELETE; для source дополнительно напомнит про осиротевший слот']
            - ['`./register.sh del all -y`', 'снести все без подтверждения']
            - ['`./register.sh st`', 'таблица NAME / CONNECTOR / TASKS']
            - ['`./register.sh st pg-orders-sink`', 'полный JSON со trace — то, что нужно при FAILED']
            - ['`./register.sh src`', 'строки public.orders']
            - ['`./register.sh src slots`', 'слоты + объём удержанного WAL']
            - ['`./register.sh trg`', 'последние 30 записей журнала']
            - ['`./register.sh trg current`', 'актуальное состояние (DISTINCT ON, без удалённых)']
            - ['`./register.sh trg dup`', 'total vs uniq — контроль идемпотентности']
            - ['`./register.sh trg lag`', 'лаг доставки по последним 20']
            - ['`./register.sh trg "SELECT …"`', 'произвольный SQL']
            - ['`./register.sh h`', 'справка']      
